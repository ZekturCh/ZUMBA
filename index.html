<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZUMBA | QR unico</title>
    <link rel="stylesheet" href="./styles.css?v=20260924-final">
  </head>
  <body class="ticket-page">
    <main class="shell">
      <section class="panel ticket-card">
        <div class="event-brand" aria-label="Colombian Flow Zumba">
          <span class="brand-zumba">ZUMBA</span>
          <span class="brand-flow">Colombian Flow</span>
          <span class="brand-meta">Masterclass internacional</span>
        </div>
        <h1>QR de uso unico</h1>
        <p id="codeLabel" class="code">Cargando...</p>
        <div id="qr" class="qr" aria-label="QR del codigo"></div>
        <p id="status" class="status">Revisando codigo.</p>
        <input id="guestNameInput" class="input hidden" type="text" maxlength="60" placeholder="Nombre opcional">
        <button id="reserveButton" class="primary" type="button" disabled>Confirmar asistencia</button>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
