<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZUMBA | Validacion QR</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">ZUMBA</p>
        <h1>Validacion de entrada</h1>
        <p id="codeLabel" class="code">Cargando...</p>
        <div id="qr" class="qr" aria-label="QR del codigo"></div>
        <p id="status" class="status">Revisando codigo.</p>
        <button id="validateButton" class="primary" type="button" disabled>Validar QR</button>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
